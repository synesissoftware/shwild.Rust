name: CI

on:
  push:
    branches:
      - master
      - dev
      - boilerplate
      - idiomatic
      - rc1
      - rc2
      - rc3
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Stable checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo test (all targets)
        run: cargo test --all-targets --locked

      - name: cargo test (no default features)
        run: cargo test --no-default-features --locked

      - name: cargo test ("assertions")
        run: cargo test --no-default-features --features assertions --locked

      - name: cargo test ("lookup-ranges")
        run: cargo test --no-default-features --features lookup-ranges --locked

      - name: cargo test ("test-regex")
        run: cargo test --no-default-features --features test-regex --locked

      - name: cargo test ("full")
        run: cargo test --no-default-features --features full --locked

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: cargo doc
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features --locked

      - name: Install pinned nightly rustfmt
        run: rustup toolchain install nightly-2026-09-10 --profile minimal --component rustfmt

      - name: rustfmt
        env:
          RUSTFMT_TOOLCHAIN: nightly-2026-09-10
          RUSTUP_TOOLCHAIN: nightly-2026-09-10
        run: ./scripts/fmt --check

      - name: DOC_76 checker
        run: python3 scripts/check_doc_76.py

      - name: RUST_TEST_NAMING checker
        run: python3 scripts/check_test_names.py

      - name: DERIVE_LAYOUT checker
        run: python3 scripts/check_derives.py

      - name: cargo build (examples)
        run: cargo build --examples --locked

      - name: cargo build (character-play example)
        run: cargo build --example character-play --features test-regex --locked

      - name: cargo publish (dry run)
        run: cargo publish --dry-run --locked

  msrv:
    name: MSRV (1.79)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.79.0

      - uses: Swatinem/rust-cache@v2

      - name: cargo check (library)
        # Full `cargo test` needs dev-deps (criterion → clap_lex 2024 edition),
        # which exceeds MSRV; the stable job runs the full test suite.
        # MSRV 1.79: default `lookup-ranges` → collect-rs → base-traits uses
        # `CStr::count_bytes()` (stabilized in Rust 1.79).
        run: cargo check --lib --locked
